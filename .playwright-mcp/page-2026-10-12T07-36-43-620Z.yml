        - generic [ref=e257]: GRADIENT
        - generic [ref=e258]: 「藍→朱」1種。1ビュー3箇所まで（ヒーローの1語＋ロゴマーク＋幾何タイル1つ）。合計面積を最小に保つ。
      - listitem [ref=e259]:
        - generic [ref=e260]: GEOMETRY
        - generic [ref=e261]: 幾何要素は 1px の線・点・番号に限定。余白の幾何学領域には 1.5px ストロークの SVG アイコン（terminal / code / pen）を配置。シャドウは原則使わない。
      - listitem [ref=e262]:
        - generic [ref=e263]: NOTEBOOK
        - generic [ref=e264]: 赤マージン線（本文ブロック左）・ドットリーダー（プロフィール）・破線（記事リスト区切り）で「紙」を示す。
      - listitem [ref=e265]:
        - generic [ref=e266]: TYPE ROLES
        - generic [ref=e267]: 明朝＝見出し / ゴシック＝本文 / Mono＝メタ情報 / Space Grotesk＝英字ロゴ。役割を混ぜない。
      - listitem [ref=e268]:
        - generic [ref=e269]: MOTION
        - generic [ref=e270]: IntersectionObserver ＋ CSS のみ（JS 約15行・ライブラリなし）。fade ＋ 16px 上昇、stagger 70ms、セクション罫線は左から伸びる。prefers-reduced-motion で全無効。
      - listitem [ref=e271]:
        - generic [ref=e272]: GLASS
        - generic [ref=e273]: ガラスは「背景にパターンや色がある場所」の浮遊要素にのみ使う（ヘッダー / 幾何タイル / カード）。blur 6–10px・背景62%・白ヘアリン罫。ヘッダーは sticky でスクロール時に実物確認。prefers-reduced-transparency では不透明に戻す。
      - listitem [ref=e274]:
        - generic [ref=e275]: DEPTH
        - generic [ref=e276]: 重なり＋ガラスで立体感。カード＝ガラス面＋フラットな6pxオフセットシャドウ（積み紙）＋ホバーで浮上、セクション番号＝罫線に跨るタブ、幾何学パターンは本文の背面に回り込む。
