        - generic [ref=f1e260]: GEOMETRY
        - generic [ref=f1e261]: 幾何要素は 1px の線・点・番号に限定。余白の幾何学領域には 1.5px ストロークの SVG アイコン（terminal / code / pen）を配置。シャドウは原則使わない。
      - listitem [ref=f1e262]:
        - generic [ref=f1e263]: NOTEBOOK
        - generic [ref=f1e264]: 赤マージン線（本文ブロック左）・ドットリーダー（プロフィール）・破線（記事リスト区切り）で「紙」を示す。
      - listitem [ref=f1e265]:
        - generic [ref=f1e266]: TYPE ROLES
        - generic [ref=f1e267]: 明朝＝見出し / ゴシック＝本文 / Mono＝メタ情報 / Space Grotesk＝英字ロゴ。役割を混ぜない。
      - listitem [ref=f1e268]:
        - generic [ref=f1e269]: MOTION
        - generic [ref=f1e270]: IntersectionObserver ＋ CSS のみ（JS 約15行・ライブラリなし）。fade ＋ 16px 上昇、stagger 70ms、セクション罫線は左から伸びる。prefers-reduced-motion で全無効。
      - listitem [ref=f1e271]:
        - generic [ref=f1e272]: GLASS
        - generic [ref=f1e273]: ガラスは「背景にパターンや色がある場所」の浮遊要素にのみ使う（ヘッダー / 幾何タイル / カード）。blur 6–10px・背景62%・白ヘアリン罫。ヘッダーは sticky でスクロール時に実物確認。prefers-reduced-transparency では不透明に戻す。
