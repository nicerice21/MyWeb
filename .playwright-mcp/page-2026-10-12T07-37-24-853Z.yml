        - generic [ref=f1e275]: DEPTH
        - generic [ref=f1e276]: 重なり＋ガラスで立体感。カード＝ガラス面＋フラットな6pxオフセットシャドウ（積み紙）＋ホバーで浮上、セクション番号＝罫線に跨るタブ、幾何学パターンは本文の背面に回り込む。
